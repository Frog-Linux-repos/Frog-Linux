name: Build Frog Linux ISO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # plasma-meta, the pacstrap tree and the squashfs together get close to the
    # ~14 GB a standard runner offers. These three
    # directories are worth about 10 GB and nothing here uses them.
    - name: Free disk space
      run: |
        set -euo pipefail
        df -h /
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                    /opt/hostedtoolcache /usr/local/share/boost
        df -h /

    - name: Install smoke-test tools
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends --yes \
          qemu-system-x86 shellcheck xorriso

    - name: Validate repository
      run: |
        set -euo pipefail
        python3 -m unittest discover -s tests -v
        bash -n scripts/*.sh archiso/airootfs/root/*.sh \
          archiso/airootfs/usr/local/bin/*.sh
        shellcheck scripts/*.sh archiso/airootfs/root/*.sh \
          archiso/airootfs/usr/local/bin/*.sh

    - name: Set up Buildx
      uses: docker/setup-buildx-action@v3

    # Cached across runs, so the CachyOS keyring dance and the Calamares compile
    # only happen when docker/Dockerfile actually changes.
    - name: Build toolchain image
      uses: docker/build-push-action@v6
      with:
        context: ./docker
        tags: frog-linux-build:latest
        load: true
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # Identical to what scripts/build-local.sh runs. mkarchiso needs loop devices
    # and a pacstrap chroot, hence --privileged; BuildKit cannot do this in a
    # Dockerfile, which is why the ISO is built here rather than in the image.
    - name: Build Frog Linux ISO
      run: |
        set -euo pipefail
        docker run --rm --privileged \
          --security-opt seccomp=unconfined \
          --security-opt apparmor=unconfined \
          -v "$PWD:/build" \
          -w /build \
          frog-linux-build:latest \
          /build/scripts/build-in-container.sh

    - name: Smoke test live boot
      run: |
        set -euo pipefail
        mapfile -t isos < <(compgen -G './output/*.iso')
        if [ "${#isos[@]}" -ne 1 ]; then
          echo "Expected one ISO, found ${#isos[@]}." >&2
          exit 1
        fi
        bash scripts/smoke-test-iso.sh "${isos[0]}"

    - name: Upload Frog Linux ISO artifact
      uses: actions/upload-artifact@v7
      with:
        path: ./output/*.iso
        if-no-files-found: error
        archive: false
