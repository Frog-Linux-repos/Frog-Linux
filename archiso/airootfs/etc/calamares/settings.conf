# Frog Linux Calamares configuration
# See https://github.com/calamares/calamares/wiki/Configuration

modules-search: [ local, /usr/lib/calamares/modules ]

# Custom instances of stock modules, so a shipped module can be reused with a
# project-specific config. Referenced in the sequence as <module>@<id>.
instances:
- id: desktop
  module: packagechooser
  config: packagechooser_desktop.conf
- id: desktop-install
  module: contextualprocess
  config: contextualprocess_desktop.conf
- id: browser
  module: packagechooser
  config: packagechooser_browser.conf
- id: browser-install
  module: contextualprocess
  config: contextualprocess_browser.conf
- id: cleanup
  module: shellprocess
  config: shellprocess_cleanup.conf
- id: prepare-network
  module: shellprocess
  config: shellprocess_prepare_network.conf
- id: verify-liveuser
  module: shellprocess
  config: shellprocess_verify_liveuser.conf
- id: remove-browser-helper
  module: shellprocess
  config: shellprocess_remove_browser_helper.conf
- id: btrfs-snapshots
  module: shellprocess
  config: shellprocess_btrfs_snapshots.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - packagechooser@desktop
  - packagechooser@browser
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  # Chrooted package installs need the live environment's working resolver.
  - shellprocess@prepare-network
  # Cleanup needs a populated target and must beat users copying /etc/skel and
  # initcpio building from the archiso preset unpackfs just laid down.
  - shellprocess@cleanup
  - contextualprocess@desktop-install
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - networkcfg
  - hwclock
  # Installing the chosen browser can pull a newer linux-cachyos, so it runs
  # before the initramfs and boot entries are generated.
  - contextualprocess@browser-install
  - shellprocess@remove-browser-helper
  - luksbootkeyfile
  - luksopenswaphookcfg
  - initcpiocfg
  - shellprocess@btrfs-snapshots
  - initcpio
  - grubcfg
  - froglimine
  - bootloader
  - removeuser
  - shellprocess@verify-liveuser
  - umount
- show:
  - finished

branding: frog

prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: false
quit-at-end: false
