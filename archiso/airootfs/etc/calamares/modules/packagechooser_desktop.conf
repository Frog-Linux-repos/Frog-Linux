mode: required
method: legacy
id: desktop

labels:
  step: "Desktop"

default: kde

items:
  - id: kde
    package: plasma-meta
    name: KDE Plasma
    description: >
      Keep the Frog Plasma desktop. Default choice; no desktop download required.
  - id: cosmic
    package: cosmic-session
    name: COSMIC
    description: >
      Install the complete COSMIC desktop and COSMIC greeter. Requires internet.
      The live desktop remains KDE Plasma.
